<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
        }

        h2 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Factorial Calculator</h2>

        <input type="number" id="number" placeholder="Enter a number">

        <button onclick="findFactorial()">Calculate</button>

        <p id="result"></p>
    </div>

    <script>
        function findFactorial() {
            let n = Number(document.getElementById("number").value);
            let result = document.getElementById("result");

            if (n < 0) {
                result.innerHTML = "Factorial is not defined for negative numbers.";
                return;
            }

            let factorial = 1;

            for (let i = 1; i <= n; i++) {
                factorial *= i;
            }

            result.innerHTML = `Factorial of ${n} is ${factorial}`;
        }
    </script>

</body>
</html>
